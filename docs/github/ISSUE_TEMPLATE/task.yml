name: Task
description: Define a concrete developer action
labels: ["type:task"]
body:
  - type: textarea
    id: action
    attributes:
      label: 🛠 Action
      description: Describe the specific step to take (<30m–2h if possible).
  - type: checkboxes
    id: done-criteria
    attributes:
      label: ✅ Done Criteria
      options:
        - label: Code implemented
        - label: Tests green
        - label: Reviewed & merged
