name: Epic
description: Define a high-level goal with linked stories
labels: ["type:epic"]
body:
  - type: input
    id: title
    attributes:
      label: Epic Title
      description: Short, goal-oriented title
  - type: textarea
    id: goal
    attributes:
      label: 🎯 Goal
      description: What is the main objective of this Epic?
  - type: textarea
    id: must-should-wont
    attributes:
      label: ✅ Must / Should / Won’t
      description: Define scope boundaries
      placeholder: |
        - Must: ...
        - Should: ...
        - Won’t: ...
  - type: textarea
    id: success
    attributes:
      label: 📊 Success Metrics
      description: How will we measure success?
  - type: textarea
    id: risks
    attributes:
      label: ⚠ Risks / Tests
      description: List risks and how to validate them
  - type: textarea
    id: stories
    attributes:
      label: 🔗 Linked Stories
      description: Reference related stories
